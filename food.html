<!DOCTYPE html>
<html lang="en">

<head>
  <title>Devendra's Dinner</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" 
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"  
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>   
</head> 

<body> 

  <h1>Dinner time by Devendra Derangula</h1>
  <div class="container">

  <div class="row">
    <div class="col-sm-2">D</div>
    <div class="col-sm-2">E</div>
    <div class="col-sm-2">R</div>
    <div class="col-sm-2">A</div>
    <div class="col-sm-2">N</div>
    <div class="col-sm-2">G</div>
  </div>

  <div class="row">
    <div class="col-md">Dosa</div>
    <div class="col-md">Eggs</div>
    <div class="col-md">Ramen</div>
    <div class="col-md">Alfredo Pasta</div>
    <div class="col-md">Nachos</div>
    <div class="col-md">Grilled Chicken</div>
  </div>

</div>
<p>
  The food row breaks first because it uses the col-md class,
  while the letter row uses col-sm-2. The medium breakpoint
  changes at a larger screen width than the small breakpoint.
</p>

<div class="container">
  <img src="dosa.jpg" class="img-fluid" alt="Dosa" width="400" height="400">
  <img src="ramen.jpg" class="img-fluid" alt="Ramen" width="400" height="400">
  <img src="nachos.jpg" class="img-fluid" alt="Nachos" width="400" height="400">
</div>

<div class="container">
  <img src="dosa.jpg" class="img-thumbnail" alt="Dosa" width="150" height="150">
  <img src="ramen.jpg" class="img-thumbnail" alt="Ramen" width="150" height="150">
  <img src="nachos.jpg" class="img-thumbnail" alt="Nachos" width="150" height="150">
</div>

</body> 

</html>
